name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .nvmrc, not a bare major: "node-version: 20" floated to whatever 20.x was newest that
      # week, and with it the bundled npm. A newer npm resolves optional peer deps differently
      # and will reject a lock file an older one wrote, which is how `npm ci` here started
      # failing on a lock that installed cleanly on the machine that wrote it. Same file drives
      # `nvm use` locally, so the two can't drift apart again.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Catches anything that only breaks in a production build (bad imports, server/client
      # boundary mistakes) rather than at type-check time. The Upstash env vars are absent here
      # on purpose: the clients are constructed lazily, so a build that needs them at module
      # load is itself the bug this step should catch.
      - run: npm run build
